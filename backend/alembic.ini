# Alembic configuration. Most settings are dynamic via env.py;
# this file mainly tells Alembic where to find migrations.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os
# URL below is overridden at runtime by env.py via get_settings().database_url.
# Kept here as a fallback for manual `alembic` invocations from backend/.
sqlalchemy.url = sqlite+aiosqlite:///%(here)s/.local_storage/dev.db

[post_write_hooks]
# Empty by default

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S