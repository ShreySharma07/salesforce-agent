[project]
name = "salesforce-agent-backend"
version = "0.2.0"
description = "Backend for the AI agent automation platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "termcolor>=2.4.0",
    "python-multipart>=0.0.20",
    "pillow>=10.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "cryptography>=43.0.0",
    # Password hashing (auth). Falls back to stdlib PBKDF2 if absent, but
    # argon2 is the intended scheme — keep it installed.
    "argon2-cffi>=23.1.0",
    # EmailStr validation on the auth schemas.
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
# Alternative LLM provider: LLM_PROVIDER=anthropic (backend pipeline + the
# sandbox LLM proxy both use it).
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Async tests are plain `async def` with no decorator; auto mode collects
# them. Requires pytest-asyncio (declared in the dev extra).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"