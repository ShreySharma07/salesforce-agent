; supervisord runs as PID 1 inside the container and orchestrates everything.
; Boot order matters: Xvfb must exist before any X client, x11vnc must
; bind to Xvfb before noVNC connects, agent comes up last when desktop is ready.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; --- Xvfb: the virtual display (priority 10 = first) ---
[program:xvfb]
priority=10
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -ac -nolisten tcp -nolisten unix
autorestart=true
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err

; --- Openbox: window manager so apps render with normal frames ---
[program:openbox]
priority=15
command=/usr/bin/openbox
user=agent
environment=DISPLAY=":99",HOME="/home/agent"
autorestart=true
stdout_logfile=/var/log/openbox.log
stderr_logfile=/var/log/openbox.err

; --- x11vnc: bridges Xvfb's display to a VNC server on port 5900 ---
[program:x11vnc]
priority=20
command=/bin/bash -c "while ! xdpyinfo -display :99 >/dev/null 2>&1; do sleep 0.5; done; exec x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -quiet"
user=agent
autorestart=true
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.err

; --- noVNC: serves a web UI that connects to x11vnc via WebSockets on 6080 ---
[program:novnc]
priority=25
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
user=agent
autorestart=true
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc.err

; --- The agent runtime (HTTP server on port 8000) ---
[program:agent]
priority=30
command=/opt/agent-venv/bin/uvicorn sandbox_agent.main:app --host 0.0.0.0 --port 8000
directory=/opt
user=agent
environment=DISPLAY=":99",HOME="/home/agent",PATH="/opt/agent-venv/bin:/usr/bin:/bin",PYTHONPATH="/opt"
autorestart=true
startsecs=5
stdout_logfile=/var/log/agent.log
stderr_logfile=/var/log/agent.err